services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pastel
      POSTGRES_PASSWORD: pastel
      POSTGRES_DB: pastel_shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastel -d pastel_shop"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://pastel:pastel@db:5432/pastel_shop?schema=public"
      APP_URL: "http://localhost:3000"
      ADMIN_ENABLED: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  node_modules:
  next_cache:
